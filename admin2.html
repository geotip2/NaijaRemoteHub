<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin2</title></head>
<body style="font-family:Arial;padding:20px;text-align:center">
<h2>NaijaRemoteHub Admin Test</h2>
<input id="email" placeholder="Email" value="naijaremotehub@gmail.com" style="padding:12px;width:90%"><br><br>
<input id="pass" type="password" placeholder="Password" style="padding:12px;width:90%"><br><br>
<button onclick="login()" style="padding:12px 30px;background:green;color:white;border:none">Login</button>
<p id="msg"></p>
<script>
function login(){
  var e = document.getElementById('email').value.trim().toLowerCase();
  var p = document.getElementById('pass').value.trim();
  alert("You typed:\nEmail: [" + e + "]\nPassword: [" + p + "]");
  if(e === "naijaremotehub@gmail.com" && p === "Admin123"){
    document.getElementById('msg').innerHTML = "<h1 style='color:green'>SUCCESS! Login Works ✅</h1>";
  } else {
    document.getElementById('msg').innerHTML = "<h3 style='color:red'>Still wrong. Check the popup above - is there a space or different letter?</h3>";
  }
}
</script>
</body>
</html>
